name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Pushing the built site to the `pages` branch needs write access to the repo.
permissions:
  contents: write

# One publish at a time; queued runs supersede each other rather than interrupting
# a push that is already in flight.
concurrency:
  group: pages-branch
  cancel-in-progress: false

env:
  PAGES_BRANCH: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve base path
        id: base
        # A project page is served from /<repo>; a user or org page is served from the root.
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        working-directory: site
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: node build.mjs

      - name: Publish to the ${{ env.PAGES_BRANCH }} branch
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Check the publish branch out beside the source tree. Creating it from the
          # current commit is only a fallback for a repository that has none yet.
          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PAGES_BRANCH"
            git worktree add ../publish "origin/$PAGES_BRANCH"
          else
            git worktree add ../publish --detach
          fi
          git -C ../publish checkout -B "$PAGES_BRANCH"

          # Replace the branch contents wholesale: the built site is the branch.
          find ../publish -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R site/dist/. ../publish/

          git -C ../publish add -A
          if git -C ../publish diff --cached --quiet; then
            echo 'Site output is unchanged; nothing to publish.'
            exit 0
          fi

          git -C ../publish commit -m "Deploy documentation site from ${GITHUB_SHA:0:7}"
          git -C ../publish push origin "$PAGES_BRANCH"
